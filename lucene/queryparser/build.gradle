description = 'Query parsers and parsing framework'

dependencies {
  moduleApi project(':lucene:core')
  moduleApi project(':lucene:queries')
  moduleApi project(':lucene:sandbox')

  moduleImplementation deps.antlr.runtime

  moduleTestImplementation project(':lucene:test-framework')
}

//
// Regenerate the antlr4 grammars of query parsers.
//

configurations.create("antlr")

dependencies {
  add("antlr", deps.antlr.core)
}

// Registers a task regenerating a pair of grammars (${grammarName}Lexer.g4, ${grammarName}Parser.g4)
// located in the given package.
def registerAntlrTask = { String taskName, String packageName, String grammarName ->
  tasks.register(taskName, {
    description = "Regenerate ${grammarName}{Lexer,Parser}.java from the corresponding *.g4 grammars"

    dependsOn configurations.antlr

    def generatedPatterns = [
      "**/${grammarName}Lexer.java",
      "**/${grammarName}Parser.java",
    ]

    def sourceDir = "src/java/${packageName.replace('.', '/')}"
    // The lexer has to come first, the parser imports its token vocabulary.
    def inputFiles = [
      file("$sourceDir/${grammarName}Lexer.g4"),
      file("$sourceDir/${grammarName}Parser.g4")
    ]
    def tempOutput = layout.buildDirectory.dir("antlr/${taskName}").get().asFile
    def outputFiles = fileTree(dir: sourceDir, includes: generatedPatterns)

    def antlrOptions = [
      "-Werror",
      "-no-listener",
      "-no-visitor",
      "-package",
      packageName,
      "-Xexact-output-dir",
    ]

    inputs.property "antlr-version", deps.antlr.core.get().version
    inputs.property "antlr-options", antlrOptions
    inputs.files inputFiles
    outputs.files outputFiles

    doFirst {
      buildGlobals.getFileOps().delete(tempOutput)
      buildGlobals.getExecOps().javaexec {
        mainClass = "org.antlr.v4.Tool"
        classpath = configurations.antlr

        ignoreExitValue = false
        args = [
          *antlrOptions,
          "-o",
          tempOutput,
          *inputFiles
        ]
      }

      def generatedFiles = fileTree(dir: tempOutput, includes: generatedPatterns)
      generatedFiles.each {file ->
        buildGlobals.modifyFile(file, {text ->
          // The generated classes are an implementation detail.
          text = text.replaceAll("public (class ${grammarName}\\w+)", "\$1")
          text = text.replaceAll("// Generated from .*",
              """
/*
 * Licensed to the Apache Software Foundation (ASF) under one or more
 * contributor license agreements.  See the NOTICE file distributed with
 * this work for additional information regarding copyright ownership.
 * The ASF licenses this file to You under the Apache License, Version 2.0
 * (the "License"); you may not use this file except in compliance with
 * the License.  You may obtain a copy of the License at
 *
 *     http://www.apache.org/licenses/LICENSE-2.0
 *
 * Unless required by applicable law or agreed to in writing, software
 * distributed under the License is distributed on an "AS IS" BASIS,
 * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
 * See the License for the specific language governing permissions and
 * limitations under the License.
 */

// ANTLR GENERATED CODE: DO NOT EDIT.
""")
          return text
        })
      }

      buildGlobals.getFileOps().copy({CopySpec spec ->
        spec.from(tempOutput)
        spec.into(sourceDir)
        spec.include(generatedPatterns)
      })
    }
  })
}

registerAntlrTask(
    "regenerateClassicQueryParser",
    "org.apache.lucene.queryparser.classic",
    "ClassicSyntaxAntlr")

registerAntlrTask(
    "regenerateSurroundQueryParser",
    "org.apache.lucene.queryparser.surround.parser",
    "SurroundSyntaxAntlr")

registerAntlrTask(
    "regenerateFlexibleStandardSyntaxParser",
    "org.apache.lucene.queryparser.flexible.standard.parser",
    "StandardSyntaxAntlr")
